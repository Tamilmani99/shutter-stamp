services:
  backend:
    build:
      context: .
      dockerfile: Dockerfile
    container_name: shutter-stamp-backend
    ports:
      - "8000:8000"
    volumes:
      - shutter_stamp_storage:/app/storage
    environment:
      STORAGE_DIR: /app/storage
      MAX_FILE_SIZE: ${MAX_FILE_SIZE:-20971520}
    restart: unless-stopped
    healthcheck:
      test: ["CMD", "python", "-c", "import urllib.request; urllib.request.urlopen('http://localhost:8000/health')"]
      interval: 30s
      timeout: 5s
      retries: 3
      start_period: 10s

  frontend:
    build:
      context: ./frontend
      dockerfile: Dockerfile
    container_name: shutter-stamp-frontend
    ports:
      - "3000:80"
    depends_on:
     backend:
      condition: service_healthy
    restart: unless-stopped

volumes:
  shutter_stamp_storage: